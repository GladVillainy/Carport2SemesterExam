<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="webp" href="/images/Fog.webp">
    <link rel="stylesheet" href="/stylesheet/userLoginCreate.css"/>

    <!--Burgermenu css-->
    <link rel="stylesheet" href="/stylesheet/header/header.css">
    <link rel="stylesheet" href="/stylesheet/header/hamburger.css">
    <link rel="stylesheet" href="/stylesheet/header/logo.css">
    <title>Login</title>
</head>
<body>
<header th:replace="~{index :: header}"></header>
<div class = "container">
<h1>Login</h1>
<p th:if="${msg}" th:text="${msg}" style="color:red;"></p>

<form action="/login" method="post">
    <input type="text" name="email" placeholder="Email"/><br/>
    <input type="password" name="password" placeholder="Password"/><br/>
    <button type="submit">Login</button>
</form>

<a href="/createUser">Opret bruger</a>
</div>
<script src="/js/hamburger.js"></script>
</body>
</html>
