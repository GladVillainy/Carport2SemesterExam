<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="webp" href="/images/Fog.webp">

    <link rel="stylesheet" href="/stylesheet/header/header.css">
    <link rel="stylesheet" href="/stylesheet/header/hamburger.css">
    <link rel="stylesheet" href="/stylesheet/header/logo.css">

    <link rel="stylesheet" href="/stylesheet/carportRequest.css">
    <title>FOG</title>
</head>
<body>
<header th:fragment="header" class="header-grid">
    <!-- hamburger menu -->
    <div id="hamburger">
        <div class="hamburger-wrapper">
            <div class="containerHamburger" onclick="Show(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
            </div>
            <div id="hamburgerMenu">
                <!-- options in burger menu -->
                <h2><a th:if="${session.currentUserActive != 'true'}" href="/login">Log In</a></h2>
                <h2><a th:if="${session.currentUserActive != 'true'}" href="/createUser">Opret en bruger</a></h2>
                <div class="currentUserCheck" th:if="${session.currentUserActive}">
                    <h2><a th:href="@{/logout}">Log Out</a></h2>
                    <h2><a th:href="@{/profil}">Profil</a></h2>
                    <!-- sælger options -->
                    <h2><a th:if="${session.currentUser.role == 'sælger'
                    or session.currentUser.role == 'admin'}"
                           th:href="@{/sales}">Sælger panel</a></h2>

                    <!-- admin options -->
                    <h2><a th:if="${session.currentUser.role == 'admin'}"
                           th:href="@{/adminMaterialCRUD}">Materiale panel</a></h2>
                    <h2><a th:if="${session.currentUser.role == 'admin'}"
                           th:href="@{/adminUserCRUD}">Bruger panel</a></h2>

                </div>
            </div>
        </div>
    </div>

    <!-- logo -->
    <div id="logo">
        <!-- link back to main page -->
        <a href="http://localhost:7070/">
            <!-- picture -->
            <img th:src="@{/images/Fog.webp}" alt="Logo">
        </a>
    </div>
</header>

<div class="container">
    <div class="pictureContainer">
        <img th:src="@{/images/carport.webp}">
    </div>
    <div class="inputContainer">
        <p th:if="${session.msg}" th:text="${session.msg}" style="color:red;"></p>
        <h1>Din forespørgsel</h1>
        <form action="/sendRequest" method="post">
            <input type="text" name="length" placeholder="Længde (cm)"/>
            <input type="text" name="width" placeholder="Bredde (cm)"/>
            <input type="text" placeholder="Højde sat til 200 (cm)" disabled/>
            <input type="hidden" name="height" value="200">
            <label>Fladt tag <input type="radio" name="roof type" value="fladt tag" checked/></label>
            <label>Høj rejsning <input type="radio" name="roof type" value="høj rejsning" disabled/></label>
            <label>Skur <input type="checkbox" name="shed"/></label>
            <input th:if="${session.currentUser == null}" type="text" name="email" placeholder="E-mail">
            <input th:if="${session.currentUser == null}" type="text" name="phone" placeholder="Telefonnummer">
            <input th:if="${session.currentUser == null}" type="text" name="address" placeholder="Adresse">
            <button type="submit">Send forespørgsel</button>
        </form>
        <p class="success" th:if="${successMsg}" th:text="${successMsg}"></p>
        <p class="fail" th:if="${failMsg}" th:text="${failMsg}"></p>
    </div>
</div>

<script src="/js/hamburger.js"></script>
</body>
</html>
