<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="webp" href="/images/Fog.webp">
    <title>Forespørgsel</title>
    <link rel="stylesheet" th:href="@{/stylesheet/carportRequest.css}">

    <!--Burgermenu css-->
    <link rel="stylesheet" href="/stylesheet/header/header.css">
    <link rel="stylesheet" href="/stylesheet/header/hamburger.css">
    <link rel="stylesheet" href="/stylesheet/header/logo.css">
</head>
<body>
<header th:replace="~{index :: header}"></header>
<div class="container">
    <h1>Din forespørgsel</h1>
    <form action="/sendRequest" method="post">
        <input type="text" name="length" placeholder="Længde"/>
        <input type="text" name="width" placeholder="Bredde"/>
        <input type="text" name="height" placeholder="Højde"/>
        <div class="radiocontainer1">Fladt tag
            <input type="radio" name="roof type" value="fladt tag"/>
        </div>
        <div class="radiocontainer2">Høj rejsning
            <input type="radio" name="roof type" value="høj rejsning"/>
        </div>
        <div class="checkboxcontainer">Skur
            <input type="checkbox" name="shed"/>
        </div>
        <input th:if="${session.currentUser == null}" type="text" name="email" placeholder="E-mail">
        <input th:if="${session.currentUser == null}" type="text" name="phone" placeholder="Telefonnummer">
        <input th:if="${session.currentUser == null}" type="text" name="address" placeholder="Adresse">
        <button type="submit">Send forespørgsel</button>
    </form>
    <p th:text="${msg}"></p>
</div>
<script src="/js/hamburger.js"></script>
</body>
</html>
