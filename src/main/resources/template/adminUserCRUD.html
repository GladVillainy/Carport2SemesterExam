<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<h1>Admin Panel</h1>
<p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

<div class="sections">

    <!-- Se alle kunder -->
    <div class="section">
        <h2>Alle kunder</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Adresse</th>
                <th>Telefon</th>
                <th>Rolle</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${allUsers}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.address}"></td>
                <td th:text="${user.phone}"></td>
                <td th:text="${user.role}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Opret bruger -->
    <div class="section">
        <h2>Opret bruger</h2>
        <form th:action="@{/createUser}" method="post">
            <input type="text" name="email" placeholder="Email"/>
            <input type="password" name="password" placeholder="Password"/>
            <input type="text" name="address" placeholder="Adresse"/>
            <input type="text" name="phoneNumber" placeholder="Telefonnummer"/>
            <select name="role">
                <option value="kunde">Kunde</option>
                <option value="sælger">Sælger</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Opret</button>
        </form>
    </div>

    <!-- Slet bruger -->
    <div class="section">
        <h2>Slet bruger</h2>
        <form th:action="@{/deleteUser}" method="post">
            <input type="text" name="user_id" placeholder="Bruger ID"/>
            <button type="submit">Slet</button>
        </form>
    </div>

</div>

</body>
</html>
