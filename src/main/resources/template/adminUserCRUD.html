<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AdminUserCRUD</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<h1>Admin Panel</h1>
<p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

<div class="sections">

    <!-- Se alle kunder -->
    <div class="section">
        <h2>Alle kunder</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Adresse</th>
                <th>Telefon</th>
                <th>Rolle</th>
                <th>Rediger</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="customer : ${allCustomer}">
                <td th:text="${customer.id}"></td>
                <td th:text="${customer.email}"></td>
                <td th:text="${customer.address}"></td>
                <td th:text="${customer.phoneNumber}"></td>
                <td th:text="${customer.role}"></td>
                <td>
                    <form th:action="@{/editUserByID}" method="post">
                        <input type="hidden" name="user_id" th:value="${customer.id}"/>
                        <input type="text" name="email" placeholder="Ny email"/>
                        <input type="text" name="address" placeholder="Ny adresse"/>
                        <input type="text" name="phoneNumber" placeholder="Nyt tlf."/>
                        <input type="text" name="password" placeholder="Nyt password"/>
                        <select name="role">
                            <option value="">Vælg rolle</option>
                            <option value="kunde">Kunde</option>
                            <option value="sælger">Sælger</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button type="submit">Gem</button>
                    </form>
                    <form th:action="@{/deleteUserByID}" method="post">
                        <input type="hidden" name="user_id" th:value="${customer.id}"/>
                        <button type="submit">Slet</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Opret bruger -->
    <div class="section">
        <h2>Opret bruger</h2>
        <form th:action="@{/createUser}" method="post">
            <input type="text" name="email" placeholder="Email"/>
            <input type="password" name="password" placeholder="Password"/>
            <input type="text" name="address" placeholder="Adresse"/>
            <input type="text" name="phoneNumber" placeholder="Telefonnummer"/>
            <select name="role">
                <option value="kunde">Kunde</option>
                <option value="sælger">Sælger</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Opret</button>
        </form>
    </div>

    <!-- Slet bruger -->
    <div class="section">
        <h2>Slet bruger</h2>
        <form th:action="@{/deleteUserByID}" method="post">
            <input type="text" name="user_id" placeholder="Bruger ID"/>
            <button type="submit">Slet</button>
        </form>
    </div>

</div>
</body>
</html>
